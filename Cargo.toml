[package]
name = "radrootsd"
version = "0.1.0"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
description = "Radroots local runtime daemon for storage, sync, and relay publishing"

[workspace]
resolver = "3"

[workspace.dependencies]
radroots_event = { version = "=0.1.0-alpha" }
radroots_event_codec = { version = "=0.1.0-alpha" }
radroots_identity = { version = "=0.1.0-alpha" }
radroots_nostr = { version = "=0.1.0-alpha" }
radroots_protocol = { version = "=0.1.0-alpha", default-features = false }
radroots_secrets = { version = "=0.1.0-alpha", default-features = false }
radroots_transport_nostr = { version = "=0.1.0-alpha", default-features = false }
radroots_transport = { version = "=0.1.0-alpha", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
radroots_event = { workspace = true, features = ["serde"] }
radroots_event_codec = { workspace = true, features = ["json"] }
radroots_identity = { workspace = true }
radroots_nostr = { workspace = true, features = ["events"] }
radroots_protocol = { workspace = true, features = ["std", "serde"] }
radroots_secrets = { workspace = true, features = ["std"] }
radroots_transport_nostr = { workspace = true }
radroots_transport = { workspace = true }
nostr = { version = "0.44.2", features = ["nip46"] }
nostr-sdk = { version = "0.44.1" }

anyhow = { version = "1" }
chacha20poly1305 = { version = "0.10" }
clap = { version = "4", features = ["derive"] }
jsonrpsee = { version = "0.26", features = ["server"] }
futures-executor = { version = "0.3" }
rand = { version = "0.9" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
serde_qs = { version = "1.0" }
sha2 = { version = "0.10" }
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "sqlite-bundled"] }
tokio = { version = "1", features = ["full"] }
thiserror = { version = "2" }
toml = { version = "0.9" }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
url = { version = "2.5.8" }
zeroize = { version = "1" }

tempfile = { version = "3" }
