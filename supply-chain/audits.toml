[[audits.crypto-bigint]]
who = "Codex (same-owner reuse of published RDP050 source review)"
criteria = "safe-to-deploy"
version = "0.7.6"
notes = "Reused exact published Lib e55c1749902811732167a2ce5c099e22e964624f source review for the identical registry version/checksum and the same identity public-point parser composition. Provider crypto-reviewed implies the required safe-to-deploy criterion. Original use restrictions remain binding; this is not a second independent audit. Reviewed the selected fixed-width comparison, limb subtraction/word primitives, fixed safegcd inversion and its constant-time versus explicitly variable-time entry points, plus the 0.7.6 correction scope. Comparison scans the public limb count; subtraction delegates to ctutils borrow primitives; fixed inversion runs a precision-derived iteration count and returns invertibility through CtOption. The release removes the affected 0.5.5/0.7.5 selections identified by RUSTSEC-2026-0387. Identity admits public points only; retained X448 remains behind its existing adapter and independent RFC7748 vectors. This focused use review is not a complete review of the 0.5-to-0.7 rewrite, arbitrary dynamic integers, all arithmetic methods or generated-code timing proof. This is automated single-owner source review, not an independent full-crate audit."

[[audits.crypto-common]]
who = "Codex (same-owner reuse of published RDP050 source review)"
criteria = "safe-to-deploy"
version = "0.2.2"
notes = "Reused exact published Lib e55c1749902811732167a2ce5c099e22e964624f source review for the identical registry version/checksum and the same identity public-point parser composition. Provider crypto-reviewed implies the required safe-to-deploy criterion. Original use restrictions remain binding; this is not a second independent audit. Reviewed the no_std/forbid-unsafe boundary, fixed-size key/IV traits and Generate implementations. Generation requires a caller-supplied TryCryptoRng, propagates failure and only enables ambient SysRng behind getrandom. Identity's arithmetic-only parser invokes neither generation nor key/IV initialization and adds no entropy source. This same-version inherited criterion does not certify arbitrary caller-provided RNGs or optional encryption implementations. This is automated single-owner source review, not an independent full-crate audit."

[[audits.ctutils]]
