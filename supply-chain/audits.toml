
# cargo-vet audits file

[criteria.network-parser-reviewed]
description = "The package's untrusted network parsing, canonicalization, size limits, recursion limits, and malformed-input behavior were reviewed for fail-closed operation."
implies = "safe-to-deploy"

[[audits.async-wsocket]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "0.17.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the complete native production modules, message/socket conversions, manifest and selected SDK WebSocket SPI, plus browser actor/stream ownership. Native errors and sink/stream polling delegate to Tokio/Tungstenite; no new unsafe Send wrapper is introduced. The Radroots adapter supplies its own DNS/address/TLS policy, exact wire-identifier admission, configured connection deadline, fixed frame bounds and metered ingress, so default proxy/SOCKS dialing is not admitted. Both native loopback suites exercise the actual composition. The new browser actor uses unbounded channels; it is not admitted as the bounded Radroots browser implementation. This focused automated native-use review does not qualify those browser queues or unrestricted default dialing."

[[audits.autocfg]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.5.1"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the complete production sources and the published 1.5.0 -> 1.5.1 delta. This build-only helper accepts trusted build-script snippets and compiler/wrapper/flag inputs, invokes Command without a shell, checks the output directory, writes compiler IR there and removes only its generated probe path. Version/IO/process failures remain errors; it has no runtime network parser. The release changes the wrapper test harness, not production probing. Current Rust 1.99 compilation executes the selected build dependency. This automated review assumes governed compiler/build inputs and is not an independent audit or permission to compile untrusted network text."

[[audits.base16ct]]
who = "Codex (same-owner reuse of published RDP050 source review)"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Reused exact published Lib e55c1749902811732167a2ce5c099e22e964624f source review for the identical registry version/checksum and the same identity public-point parser composition. Provider crypto-reviewed implies the required safe-to-deploy criterion. Original use restrictions remain binding; this is not a second independent audit. Reviewed the no_std feature boundary, decoded-length and decode_inner implementations. Decoding requires even input length and a sufficiently large destination, accumulates invalid-nibble errors and returns a bounded slice. Identity uses its own exact-size public hexadecimal admission and calls k256 with bytes, not this package's text API. No key generation or entropy source is selected by that call. Constant-time descriptions remain best effort, with public input length observable. This is automated single-owner source review, not an independent full-crate audit."

[[audits.bech32]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "0.12.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the manifest, top-level decode entry, HRP admission, character/separator checking and checksum-to-byte-iterator path. HRPs have a fixed 83-byte buffer; invalid characters, mixed case, missing separators, insufficient checksum and code-length violations return errors before collecting decoded bytes. Allocating decoding is proportional to admitted input, so callers still need input bounds. The private native Nostr path receives bounded frames and requires canonical hexadecimal EVENT/OK identities before SDK parsing; it does not accept Bech32 aliases as wire identity. This focused automated native-use review does not qualify Bitcoin witness policies, checksum selection by arbitrary callers or unbounded NIP-19 data."

[[audits.bitcoin-consensus-encoding]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.3.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the manifest and feature boundaries, slice decoder drivers, fixed ArrayDecoder and byte/array encoders, and complete compact-size byte admission and minimal-encoding checks. The selected native dependency has no alloc/std/serde features; bitcoin_hashes uses fixed-size array codec traits, not a Bitcoin peer or transaction parser. Fixed buffers advance by the available remaining bytes and reject incomplete completion; exact slice decoding rejects trailing input. Arbitrary user-supplied decoders must make progress, and optional allocating collection/IO drivers are outside this admitted use. This focused automated native-use review does not qualify those optional APIs or provide a general resource bound for caller-defined codecs."

[[audits.bitcoin-internals]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "0.6.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed all production modules and the build script/manifest: fixed-array/slice transformations, the Copy-only ArrayVec safety boundary, bounded serde insertion, error/storage macros and integer casts. ArrayVec tracks initialized elements within static capacity; safe insertion refuses excess capacity and its raw slice view covers only initialized elements. Slice chunking checks nonzero constant chunk sizes. Some caller APIs can panic on invalid ranges/capacity, and allocating errors can retain raw input. Native hash callers use fixed block/array sizes and public adapter errors normalize upstream causes. The build script runs the governed rustc directly and writes only OUT_DIR/rust_version.rs. This automated source review is not a general unsafe-code proof or redaction guarantee for arbitrary callers."

[[audits.bitcoin-internals]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
delta = "0.6.0 -> 0.7.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the complete production delta and manifest: shared array/slice safety code and build script remain unchanged, input-error formatting escapes debug characters, an integer widening cast is added, and U256 uses two fixed u128 words. U256 hex/byte serde requires exactly 32 bytes; decimal parsing returns overflow/invalid-input errors, formatting uses fixed buffers, and arithmetic/division retain documented panic conditions. Test-only serde dependencies move out of the production feature surface. Current native dependencies select no optional serde/alloc features on either internals version and do not expose U256 arithmetic as Radroots agreement values. This automated delta inherits the reviewed 0.6 source and does not qualify arbitrary arithmetic operands or monetary semantics."

[[audits.bitcoin_hashes]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.2.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the selected feature manifest, fixed-hash construction/serde/hex macros, SHA256 buffering and finalization, normal software and CPU-dispatched block-processing paths, and native call sites. Fixed hash byte decoding requires exact array length; string decoding uses the reviewed fixed-size hex decoder. SHA256 buffers at most one 64-byte block and dispatches intrinsic implementations only after CPU feature detection; their four 16-byte block loads are reached with complete blocks. Native adapter ingress is bounded before hashing and its interoperation tests compare event identities across the independent codecs on macOS and Linux. This focused automated native-use review does not independently certify the cryptographic algorithm, every hash family, batch hashing API, unlimited incremental input, or another platform."

[[audits.bitflags]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.3.2"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed the manifest and complete production macro expansion and attribute filtering. Generated values contain a caller-selected integer; checked from_bits rejects unknown bits, truncate masks them, and remove uses bit-clear while toggle uses XOR. The unsafe constructor preserves bits and requires the caller's documented validity invariant. There is no byte decoder, allocation, filesystem or process access. This same-version package was already locked with a safe-to-deploy exemption; its newly inherited network criterion is evaluated for the current native composition, where the optional embedded logging edge is not selected. This is automated source review, not application authorization or optional-feature execution evidence."

[[audits.byteorder]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.5.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed feature boundaries, fixed integer reads/writes, variable-byte-length admission and slice conversion macros used by the hash32 edge. The selected no_std feature set excludes I/O extension helpers. Primitive reads use exact bounded slices and native endian conversions; invalid caller buffer lengths panic, rather than supplying partial values. This edge is compiled through heapless, while the admitted faster-hex std/alloc runtime uses its allocating implementation and no hash32 parser. This focused automated native-use review qualifies no arbitrary-length reader, dynamic allocation policy or invalid-call panic freedom."

[[audits.cmov]]
