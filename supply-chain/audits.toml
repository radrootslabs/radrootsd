[[audits.defmt-parser]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
version = "1.1.0"
notes = "Reused exact published Lib 3af7814ea4f76f2cca3d33d4c2bd8a854f3fb78f source review for the identical registry version/checksum and same private native transport composition. Rand 0.10.1 is the reviewed baseline for a separately recorded 0.10.3 delta. Original use restrictions remain binding; this is not a second independent audit. Reviewed all production parsing modules: format fragments, type names, display hints, array/range integers, brace admission and argument consistency. Parsing follows UTF-8 character boundaries and reports malformed types/ranges/braces. Argument indices control vector resizing and index-plus-one arithmetic, so this parser is unsuitable for untrusted network input without separate input/index bounds. The only relevant dependency route is optional compile-time defmt macros with trusted literals, and both selected native graphs exclude it. This automated inactive-use review supplies no runtime parser/resource qualification or permission to route network strings through this API."

[[audits.der]]
